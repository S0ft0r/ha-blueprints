<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HA Watering Admin Panel</title>
    <style>
        :root {
            --primary-color: #44739e;
            --danger-color: #ff5252;
            --success-color: #4caf50;
            --bg-color: #eceff1;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-color); padding: 20px; color: var(--text-color); line-height: 1.5; }
        .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        
        .config-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary-color); margin-bottom: 20px; padding-bottom: 15px; }
        h2 { color: var(--primary-color); margin: 0; font-size: 1.5em; }

        .settings-bar { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #dee2e6; }
        .setting-box label { display: block; font-weight: bold; font-size: 0.85em; margin-bottom: 8px; color: #555; }
        .settings-bar input { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }

        .zone { border: 1px solid #e0e0e0; padding: 20px; margin-bottom: 15px; border-radius: 10px; position: relative; background: #fdfdfd; transition: border-color 0.2s; }
        .zone:hover { border-color: var(--primary-color); }
        .remove-btn { position: absolute; right: 10px; top: 10px; background: none; color: #adb5bd; border: none; font-size: 1.2em; cursor: pointer; padding: 5px; }
        .remove-btn:hover { color: var(--danger-color); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field-group { display: flex; flex-direction: column; }
        .field-group label { font-size: 0.85em; font-weight: bold; margin-bottom: 8px; color: #666; display: flex; align-items: center; }

        select { padding: 10px; border: 1px solid #ced4da; border-radius: 6px; background-color: #fff; font-size: 0.95em; cursor: pointer; }
        .id-badge { background: var(--primary-color); color: white; padding: 2px 8px; border-radius: 4px; font-family: monospace; margin-left: 10px; font-size: 0.9em; }

        .btn { border: none; border-radius: 6px; padding: 12px 20px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; font-size: 1em; }
        .add-btn { background: var(--success-color); color: white; width: 100%; margin-top: 10px; }
        .refresh-btn { background: white; border: 1px solid #ced4da; padding: 8px 15px; font-size: 0.9em; }
        .copy-btn { background: var(--primary-color); color: white; border: none; padding: 10px; cursor: pointer; border-radius: 6px; margin-top: 8px; width: 100%; font-size: 0.9em; }

        /* Вывод кода */
        .outputs-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .output-box label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 10px; color: var(--primary-color); }
        textarea { width: 100%; height: 350px; font-family: 'Cascadia Code', 'Consolas', monospace; padding: 15px; border-radius: 8px; background: #282c34; color: #abb2bf; border: none; box-sizing: border-box; resize: vertical; line-height: 1.4; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <div class="config-header">
        <h2>🌱 Конструктор матрицы полива</h2>
        <button class="btn refresh-btn" onclick="fetchEntities()">🔄 Обновить данные HA</button>
    </div>

    <div class="settings-bar">
        <div class="setting-box">
            <label>Долгосрочный токен доступа (Token):</label>
            <input type="password" id="ha-token" onchange="saveSettings()">
        </div>
        <div class="setting-box">
            <label>Фильтр названий насосов:</label>
            <input type="text" id="entity-filter" value="watering_pump_" oninput="saveSettings()">
        </div>
    </div>

    <div id="zones-list"></div>
    <button class="btn add-btn" onclick="addZone()">+ ДОБАВИТЬ КАНАЛ ПОЛИВА</button>

    <div class="outputs-container">
        <div class="output-box">
            <label>1. Матрица (watering.yaml):</label>
            <textarea id="output-config" readonly></textarea>
            <button class="btn copy-btn" onclick="copyCode('output-config')">📋 КОПИРОВАТЬ МАТРИЦУ</button>
        </div>
        <div class="output-box">
            <label>2. Статус-сенсоры (status.yaml):</label>
            <textarea id="output-sensors" readonly></textarea>
            <button class="btn copy-btn" onclick="copyCode('output-sensors')">📋 КОПИРОВАТЬ СЕНСОРЫ</button>
        </div>
    </div>
</div>

<script>
    let allEntities = [];
    let zones = [{ valve: '', sensor: 'none' }];

    document.getElementById('ha-token').value = localStorage.getItem('ha_token') || '';
    document.getElementById('entity-filter').value = localStorage.getItem('ha_filter') || 'watering_pump_';

    function saveSettings() {
        localStorage.setItem('ha_token', document.getElementById('ha-token').value);
        localStorage.setItem('ha_filter', document.getElementById('entity-filter').value);
        render();
    }

    function calculateId(entityId) {
        if (!entityId) return null;
        const match = entityId.match(/_(\d+)_switch_(\d+)/);
        if (match) {
            const pumpNum = match[1];
            const channelChar = String.fromCharCode(96 + parseInt(match[2]));
            return pumpNum + channelChar;
        }
        return null;
    }

    async function fetchEntities() {
        const token = document.getElementById('ha-token').value;
        if (!token) return;
        try {
            const response = await fetch('/api/states', {
                headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" }
            });
            allEntities = await response.json();
            render();
        } catch (e) { alert("Ошибка HA"); }
    }

    function render() {
        const list = document.getElementById('zones-list');
        list.innerHTML = '';
        const filter = document.getElementById('entity-filter').value.toLowerCase();
        const valves = allEntities.filter(e => e.entity_id.startsWith('switch.') && e.entity_id.includes(filter));
        const sensors = allEntities.filter(e => e.entity_id.includes('moisture'));

        zones.forEach((zone, index) => {
            const calcId = calculateId(zone.valve);
            const div = document.createElement('div');
            div.className = 'zone';
            div.innerHTML = `
                <button class="remove-btn" onclick="removeZone(${index})">✕</button>
                <div class="grid">
                    <div class="field-group">
                        <label>Насос/Канал ${calcId ? `<span class="id-badge">ID: ${calcId}</span>` : ''}</label>
                        <select onchange="updateZone(${index}, 'valve', this.value)">
                            <option value="">-- выберите --</option>
                            ${valves.map(v => `<option value="${v.entity_id}" ${zone.valve === v.entity_id ? 'selected' : ''}>${v.attributes.friendly_name || v.entity_id}</option>`).join('')}
                        </select>
                    </div>
                    <div class="field-group">
                        <label>Сенсор влажности</label>
                        <select onchange="updateZone(${index}, 'sensor', this.value)">
                            <option value="none">none</option>
                            ${sensors.map(s => `<option value="${s.entity_id}" ${zone.sensor === s.entity_id ? 'selected' : ''}>${s.attributes.friendly_name || s.entity_id}</option>`).join('')}
                        </select>
                    </div>
                </div>
            `;
            list.appendChild(div);
        });
        generateYAML();
    }

    function addZone() { zones.push({ valve: '', sensor: 'none' }); render(); }
    function removeZone(index) { zones.splice(index, 1); render(); }
    function updateZone(index, field, value) { zones[index][field] = value; render(); }

    function generateYAML() {
        const validZones = zones.filter(z => z.valve && calculateId(z.valve));
        
        // 1. ГЕНЕРАЦИЯ КОНФИГА
        let configYaml = "config: >\n  {% set zones = [\n";
        validZones.forEach((z, i) => {
            const id = calculateId(z.valve);
            configYaml += `    {\n      "name": "Канал ${id.toUpperCase()}",\n      "valve": "${z.valve}",\n      "moisture_sensor": "${z.sensor}",\n      "morning": {\n        "timework": states('input_number.watering_pump_${id}_timework_morning') | int(0),\n        "mode": states('input_select.watering_pump_${id}_mode_morning')\n      },\n      "evening": {\n        "timework": states('input_number.watering_pump_${id}_timework_evening') | int(0),\n        "mode": states('input_select.watering_pump_${id}_mode_evening')\n      }\n    }${i === validZones.length - 1 ? '' : ','}\n`;
        });
        configYaml += "  ] %}\n  {{ zones }}";
        document.getElementById('output-config').value = configYaml;

        // 2. ГЕНЕРАЦИЯ СТАТУС-СЕНСОРОВ
        let sensorYaml = "- sensor:\n";
        validZones.forEach(z => {
            const id = calculateId(z.valve);
            ['morning', 'evening'].forEach(period => {
                const helper = `input_select.watering_pump_${id}_mode_${period}`;
                sensorYaml += `  - name: watering_${id}_${period}\n`;
                sensorYaml += `    state: "{{ 'off' if states('${helper}') == 'Отключено' else 'on' }}"\n`;
                sensorYaml += `    icon: |\n`;
                sensorYaml += `      {% set s = states('${helper}') %}\n`;
                sensorYaml += `      {% set d = (now().timestamp() / 86400) | int %}\n`;
                sensorYaml += `      {% if s == 'Отключено' %} local:button-unpressed\n`;
                sensorYaml += `      {% elif (s == 'Через день' and d % 2 == 0) or (s == 'Через два дня' and d % 3 == 0) or (s == 'Ежедневно' or s == 'По датчику') %} local:button-pressed\n`;
                sensorYaml += `      {% else %} local:button-unavailable\n`;
                sensorYaml += `      {% endif %}\n\n`;
            });
        });
        document.getElementById('output-sensors').value = sensorYaml;
    }

    function copyCode(id) {
        document.getElementById(id).select();
        document.execCommand("copy");
        alert("Код скопирован!");
    }

    if (localStorage.getItem('ha_token')) fetchEntities();
</script>
</body>
</html>

lueprint:
  name: "Управление поливом по матрице"
  description: "Полив на основе данных из сенсора watering_configuration"
  domain: automation
  input:
    config_sensor:
      name: Сенсор конфигурации
      default: sensor.watering_configuration
      selector:
        entity:
          filter:
            - domain: sensor
    soil_threshold:
      name: Глобальный порог влажности
      description: "Если влажность выше этого значения, полив пропускается (для режимов с датчиком)"
      default: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    morning_time:
      name: Время утреннего полива
      default: "08:00:00"
      selector:
        time: {}
    evening_time:
      name: Время вечернего полива
      default: "20:00:00"
      selector:
        time: {}

mode: single

triggers:
  - trigger: time
    at: !input morning_time
    id: "morning"
  - trigger: time
    at: !input evening_time
    id: "evening"

variables:
  config_sensor: !input config_sensor
  # Загружаем массив объектов
  zones: "{{ state_attr(config_sensor, 'config') }}"
  # Текущий период
  period: "{{ trigger.id }}"
  # Логика дней
  day_num: "{{ (now().timestamp() / 86400) | int }}"
  is_alt_day: "{{ day_num % 2 == 0 }}"
  is_third_day: "{{ day_num % 3 == 0 }}"

actions:
  # Проверяем, включен ли общий выключатель (состояние сенсора)
  - condition: template
    value_template: "{{ is_state(config_sensor, 'on') }}"

  - repeat:
      for_each: "{{ zones }}"
      sequence:
        - variables:
            zone: "{{ repeat.item }}"
            settings: "{{ zone[period] }}"
            mode: "{{ settings.mode }}"
            
            # 1. Проверка дня полива
            is_watering_day: >
              {% if mode == 'Ежедневно' %} true
              {% elif mode == 'Через день' %} {{ is_alt_day }}
              {% elif mode == 'Через два дня' %} {{ is_third_day }}
              {% elif mode == 'По датчику' %} true
              {% else %} false
              {% endif %}

            # 2. Проверка влажности
            moisture_val: "{{ states(zone.moisture_sensor) | float(100) if zone.moisture_sensor != 'none' else 0 }}"
            soil_is_dry: >
              {% if mode == 'По датчику' or (zone.moisture_sensor != 'none' and is_watering_day) %}
                {{ moisture_val < (states('input_number.watering_global_threshold') | default(50) | float) }}
              {% else %}
                true
              {% endif %}

        # Выполняем, если день подходит, почва сухая и время полива > 0
        - if:
            - condition: template
              value_template: "{{ is_watering_day and soil_is_dry and settings.timework | int > 0 }}"
          then:
            - action: switch.turn_on
              target:
                entity_id: "{{ zone.valve }}"
            - delay:
                seconds: "{{ settings.timework | int }}"
            - action: switch.turn_off
              target:
                entity_id: "{{ zone.valve }}"
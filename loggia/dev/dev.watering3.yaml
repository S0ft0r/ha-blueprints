blueprint:
  name: Управление оросительной системой
  description: |
    ### Управление оросительной системой лоджии.
    <small>Версия 2026.07.01 Сборка 1</small>

    <small><a href="https://github.com/S0ft0r/ha-blueprints/blob/main/as-is.md">Отказ от ответственности</a></small>
  domain: automation
  source_url: https://github.com/S0ft0r/ha-blueprints/blob/main/loggia/dev/dev.watering3.yaml
  author: Softor

  input:

    ####################################################################
    # Утро
    ####################################################################

    morning_section:
      name: Утренний полив
      icon: mdi:clock-time-four-outline
      input:
        morning_enabled:
          name: Включить утренний полив
          default: false
          selector:
            boolean: {}

        set_on_time_morning:
          name: Время включения
          default: "08:00:00"
          selector:
            time: {}

        set_time_work_reduced_morning:
          name: Длительность полива (уменьшенная)
          description: Время работы каждого направления
          default: 30
          selector:
            number:
              min: 1
              max: 600
              step: 1
              mode: box
              unit_of_measurement: "сек"

        set_time_work_standard_morning:
          name: Длительность полива (стандартная)
          description: Время работы каждого направления
          default: 60
          selector:
            number:
              min: 1
              max: 600
              step: 1
              mode: box
              unit_of_measurement: "сек"

        set_time_work_increased_morning:
          name: Длительность полива (увеличенная)
          description: Время работы каждого направления
          default: 120
          selector:
            number:
              min: 1
              max: 600
              step: 1
              mode: box
              unit_of_measurement: "сек"

        morning_daily_reduced_valves:
          name: Направления для ежедневного полива утром с уменьшенным временем
          description: |
            Эти направления будут поливаться каждый день утром.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

        morning_daily_standard_valves:
          name: Направления для ежедневного полива утром
          description: |
            Эти направления будут поливаться каждый день утром.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

        morning_daily_increased_valves:
          name: Направления для ежедневного полива утром с увеличенным временем
          description: |
            Эти направления будут поливаться каждый день утром.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

        morning_alternate_reduced_valves:
          name: Направления для полива через день утром с уменьшенным временем
          description: |
            Эти направления будут поливаться через день утром.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

        morning_alternate_standard_valves:
          name: Направления для полива через день утром
          description: |
            Эти направления будут поливаться через день утром.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

        morning_alternate_increased_valves:
          name: Направления для полива через день утром с увеличенным временем
          description: |
            Эти направления будут поливаться через день утром.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

    ####################################################################
    # Вечер
    ####################################################################

    evening_section:
      name: Вечерний полив
      icon: mdi:clock-time-eight-outline
      input:
        evening_enabled:
          name: Включить вечерний полив
          default: false
          selector:
            boolean: {}

        set_on_time_evening:
          name: Время включения
          default: "20:00:00"
          selector:
            time: {}

        set_time_work_reduced_evening:
          name: Длительность полива (уменьшенная)
          description: Время работы каждого направления
          default: 30
          selector:
            number:
              min: 1
              max: 600
              step: 1
              mode: box
              unit_of_measurement: "сек"

        set_time_work_standard_evening:
          name: Длительность полива (стандартная)
          description: Время работы каждого направления
          default: 60
          selector:
            number:
              min: 1
              max: 600
              step: 1
              mode: box
              unit_of_measurement: "сек"

        set_time_work_increased_evening:
          name: Длительность полива (увеличенная)
          description: Время работы каждого направления
          default: 120
          selector:
            number:
              min: 1
              max: 600
              step: 1
              mode: box
              unit_of_measurement: "сек"

        evening_daily_reduced_valves:
          name: Направления для ежедневного полива вечером с уменьшенным временем
          description: |
            Эти направления будут поливаться каждый день вечером.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

        evening_daily_standard_valves:
          name: Направления для ежедневного полива вечером
          description: |
            Эти направления будут поливаться каждый день вечером.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

        evening_daily_increased_valves:
          name: Направления для ежедневного полива вечером с увеличенным временем
          description: |
            Эти направления будут поливаться каждый вечером утром.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

        evening_alternate_reduced_valves:
          name: Направления для полива через вечером утром с уменьшенным временем
          description: |
            Эти направления будут поливаться через вечером утром.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

        evening_alternate_standard_valves:
          name: Направления для полива через вечером утром
          description: |
            Эти направления будут поливаться через вечером утром.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

        evening_alternate_increased_valves:
          name: Направления для полива через день вечером с увеличенным временем
          description: |
            Эти направления будут поливаться через день вечером.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              multiple: true

    ####################################################################
    # Влажность почвы
    ####################################################################

    soil_section:
      name: Влажность почвы
      icon: mdi:flower-tulip-outline
      collapsed: true
      input:
        set_use_soil_moisture:
          name: Учитывать влажность почвы
          description: |
            Если включено, при плановом поливе направления
            с влажностью выше порога будут пропущены.
          default: false
          selector:
            boolean: {}

        soil_moisture_valves:
          name: Направления с датчиками влажности
          description: |
            Выберите направления, у которых есть датчик влажности.
            Порядок должен соответствовать списку датчиков ниже.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - switch
              reorder: true
              multiple: true

        soil_moisture_sensors:
          name: Датчики влажности почвы
          description: |
            Выберите датчики влажности в том же порядке, что и направления выше.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - sensor
                  device_class: moisture
              reorder: true
              multiple: true

        set_soil_skip_threshold:
          name: Не поливать, если влажность выше
          default: 65
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"

        soil_watering_enabled:
          name: Внеплановый полив при низкой влажности
          default: false
          selector:
            boolean: {}

        set_soil_moisture_min:
          name: Порог низкой влажности
          description: Ниже этого значения запускается внеплановый полив
          default: 30
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: "%"

        set_time_work_soil:
          name: Длительность внепланового полива
          default: 15
          selector:
            number:
              min: 1
              max: 600
              step: 1
              mode: box
              unit_of_measurement: "сек"

        set_debounce_enabled:
          name: Защита от перелива
          default: false
          selector:
            boolean: {}

        set_debounce_time:
          name: Пауза между срабатываниями
          description: |
            Минимальная пауза между повторными включениями
            по датчику влажности.
          default: "00:10:00"
          selector:
            time: {}

trigger_variables:
  morning_daily_reduced_valves: !input morning_daily_reduced_valves
  morning_daily_standard_valves: !input morning_daily_standard_valves
  morning_daily_increased_valves: !input morning_daily_increased_valves

  morning_alternate_reduced_valves: !input morning_alternate_reduced_valves
  morning_alternate_standard_valves: !input morning_alternate_standard_valves
  morning_alternate_increased_valves: !input morning_alternate_increased_valves

  evening_daily_reduced_valves: !input evening_daily_reduced_valves
  evening_daily_standard_valves: !input evening_daily_standard_valves
  evening_daily_increased_valves: !input evening_daily_increased_valves

  evening_alternate_reduced_valves: !input evening_alternate_reduced_valves
  evening_alternate_standard_valves: !input evening_alternate_standard_valves
  evening_alternate_increased_valves: !input evening_alternate_increased_valves

  soil_moisture_valves: !input soil_moisture_valves
  soil_moisture_sensors: !input soil_moisture_sensors

  set_use_soil_moisture: !input set_use_soil_moisture
  soil_watering_enabled: !input soil_watering_enabled
  set_soil_moisture_min: !input set_soil_moisture_min
  set_soil_skip_threshold: !input set_soil_skip_threshold

  set_debounce_enabled: !input set_debounce_enabled
  set_debounce_time: !input set_debounce_time

  is_soil_defined: "{{ soil_moisture_valves != [] and soil_moisture_sensors != [] }}"

  invalid_states:
    - ""
    - "unavailable"
    - "unknown"
    - "none"

variables:
  is_alternate_day: "{{ (now().timestamp() / 86400) | int % 2 == 0 }}"

  # --- ПОДГОТОВКА СПИСКОВ (УТРО) ---
  m_valves_red: >
    {% set daily = morning_daily_reduced_valves | default([]) %}
    {% set alt = morning_alternate_reduced_valves | default([]) if is_alternate_day else [] %}
    {{ (daily + alt) | unique | list }}
  m_valves_std: >
    {% set daily = morning_daily_standard_valves | default([]) %}
    {% set alt = morning_alternate_standard_valves | default([]) if is_alternate_day else [] %}
    {{ (daily + alt) | unique | list }}
  m_valves_inc: >
    {% set daily = morning_daily_increased_valves | default([]) %}
    {% set alt = morning_alternate_increased_valves | default([]) if is_alternate_day else [] %}
    {{ (daily + alt) | unique | list }}

  # --- ПОДГОТОВКА СПИСКОВ (ВЕЧЕР) ---
  e_valves_red: >
    {% set daily = evening_daily_reduced_valves | default([]) %}
    {% set alt = evening_alternate_reduced_valves | default([]) if is_alternate_day else [] %}
    {{ (daily + alt) | unique | list }}
  e_valves_std: >
    {% set daily = evening_daily_standard_valves | default([]) %}
    {% set alt = evening_alternate_standard_valves | default([]) if is_alternate_day else [] %}
    {{ (daily + alt) | unique | list }}
  e_valves_inc: >
    {% set daily = evening_daily_increased_valves | default([]) %}
    {% set alt = evening_alternate_increased_valves | default([]) if is_alternate_day else [] %}
    {{ (daily + alt) | unique | list }}

  debounce_seconds: >
    {{ set_debounce_time.split(':')[0] | int * 3600
     + set_debounce_time.split(':')[1] | int * 60
     + set_debounce_time.split(':')[2] | int }}

triggers:
  - platform: time
    at: !input set_on_time_morning
    id: on_time_morning_trigger
    enabled: !input morning_enabled

  - platform: time
    at: !input set_on_time_evening
    id: on_time_evening_trigger
    enabled: !input evening_enabled

  - trigger: numeric_state
    entity_id: !input soil_moisture_sensors
    below: !input set_soil_moisture_min
    id: soil_low_trigger
    enabled: "{{ is_soil_defined and soil_watering_enabled }}"

actions:
  - choose:
      #####################################################################
      # УТРЕННИЙ ПОЛИВ
      #####################################################################
      - conditions:
          - condition: trigger
            id: on_time_morning_trigger
        sequence:
          # 1. УМЕНЬШЕННЫЙ ПОЛИВ
          - repeat:
              for_each: "{{ m_valves_red }}"
              sequence:
                - &water_logic
                  variables:
                    current_valve: "{{ repeat.item }}"
                    # Оставили только логику датчиков влажности
                    current_soil_sensor: >
                      {% set ns = namespace(idx=-1) %}
                      {% for valve in soil_moisture_valves | list %}
                        {% if valve == current_valve and ns.idx == -1 %}{% set ns.idx = loop.index0 %}{% endif %}
                      {% endfor %}
                      {{ soil_moisture_sensors[ns.idx] if ns.idx >= 0 and (soil_moisture_sensors | count) > ns.idx else '' }}
                    current_soil_blocked: >
                      {{ set_use_soil_moisture and current_soil_sensor != '' and states(current_soil_sensor) not in invalid_states 
                         and (states(current_soil_sensor) | float(-1)) >= (set_soil_skip_threshold | float) }}
                - if:
                    - condition: template
                      value_template: "{{ not current_soil_blocked }}"
                  then:
                    - action: homeassistant.turn_on
                      target:
                        entity_id: "{{ current_valve }}"
                    - delay:
                        seconds: !input set_time_work_reduced_morning
                    - action: homeassistant.turn_off
                      target:
                        entity_id: "{{ current_valve }}"

          # 2. СТАНДАРТНЫЙ ПОЛИВ
          - repeat:
              for_each: "{{ m_valves_std }}"
              sequence:
                - *water_logic
                - if:
                    - condition: template
                      value_template: "{{ not current_soil_blocked }}"
                  then:
                    - action: homeassistant.turn_on
                      target:
                        entity_id: "{{ current_valve }}"
                    - delay:
                        seconds: !input set_time_work_standard_morning
                    - action: homeassistant.turn_off
                      target:
                        entity_id: "{{ current_valve }}"

          # 3. УВЕЛИЧЕННЫЙ ПОЛИВ
          - repeat:
              for_each: "{{ m_valves_inc }}"
              sequence:
                - *water_logic
                - if:
                    - condition: template
                      value_template: "{{ not current_soil_blocked }}"
                  then:
                    - action: homeassistant.turn_on
                      target:
                        entity_id: "{{ current_valve }}"
                    - delay:
                        seconds: !input set_time_work_increased_morning
                    - action: homeassistant.turn_off
                      target:
                        entity_id: "{{ current_valve }}"

      #####################################################################
      # ВЕЧЕРНИЙ ПОЛИВ
      #####################################################################
      - conditions:
          - condition: trigger
            id: on_time_evening_trigger
        sequence:
          # 1. УМЕНЬШЕННЫЙ ПОЛИВ
          - repeat:
              for_each: "{{ e_valves_red }}"
              sequence:
                - *water_logic
                - if:
                    - condition: template
                      value_template: "{{ not current_soil_blocked }}"
                  then:
                    - action: homeassistant.turn_on
                      target:
                        entity_id: "{{ current_valve }}"
                    - delay:
                        seconds: !input set_time_work_reduced_evening
                    - action: homeassistant.turn_off
                      target:
                        entity_id: "{{ current_valve }}"

          # 2. СТАНДАРТНЫЙ ПОЛИВ
          - repeat:
              for_each: "{{ e_valves_std }}"
              sequence:
                - *water_logic
                - if:
                    - condition: template
                      value_template: "{{ not current_soil_blocked }}"
                  then:
                    - action: homeassistant.turn_on
                      target:
                        entity_id: "{{ current_valve }}"
                    - delay:
                        seconds: !input set_time_work_standard_evening
                    - action: homeassistant.turn_off
                      target:
                        entity_id: "{{ current_valve }}"

          # 3. УВЕЛИЧЕННЫЙ ПОЛИВ
          - repeat:
              for_each: "{{ e_valves_inc }}"
              sequence:
                - *water_logic
                - if:
                    - condition: template
                      value_template: "{{ not current_soil_blocked }}"
                  then:
                    - action: homeassistant.turn_on
                      target:
                        entity_id: "{{ current_valve }}"
                    - delay:
                        seconds: !input set_time_work_increased_evening
                    - action: homeassistant.turn_off
                      target:
                        entity_id: "{{ current_valve }}"

      #####################################################################
      # ВНЕПЛАНОВЫЙ ПОЛИВ (БЕЗ ИЗМЕНЕНИЙ)
      #####################################################################
      - conditions:
          - condition: trigger
            id: soil_low_trigger
        sequence:
          - variables:
              triggered_sensor: "{{ trigger.entity_id }}"
              triggered_valve: >
                {% set ns = namespace(idx=-1) %}
                {% for sensor in soil_moisture_sensors | list %}
                  {% if sensor == triggered_sensor and ns.idx == -1 %}{% set ns.idx = loop.index0 %}{% endif %}
                {% endfor %}
                {{ soil_moisture_valves[ns.idx] if ns.idx >= 0 and (soil_moisture_valves | count) > ns.idx else '' }}
          - if:
              - condition: template
                value_template: "{{ triggered_valve != '' }}"
            then:
              - action: homeassistant.turn_on
                target:
                  entity_id: "{{ triggered_valve }}"
              - delay:
                  seconds: !input set_time_work_soil
              - action: homeassistant.turn_off
                target:
                  entity_id: "{{ triggered_valve }}"

mode: single

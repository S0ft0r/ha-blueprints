blueprint:
  name: Голосовой контроль чайника (Water Heater Voice Control)
  description: |
    Управление чайником (water_heater) через голосового ассистента.
    Поддерживает команды: "Вскипяти", "Вскипяти для чая", "Подогрей для кофе"
    и автоматически уведомляет голосом при достижении целевой температуры.
    
    **Требования:**
    - Интеграция water_heater для чайника
    - Интеграция media_player для голосового уведомления
    - Голосовой триггер (yandex_intent)
    
    **Команды:**
    - "Вскипяти" → нагрев до 100°C
    - "Вскипяти для чая" → нагрев до 70°C
    - "Подогрей для кофе" → нагрев до 85°C
  domain: automation
  source_url: https://github.com/S0ft0r/ha-blueprints/blob/main/other/dev/dev.kettle.yaml
  author: Softor

  input:
    water_heater:
      name: Чайник (Water Heater)
      description: |
        Сущность water_heater, управляющая чайником.
        Если ничего не выбрано — используется первый доступный water_heater.
      default: ""
      selector:
        entity:
          filter:
            - domain:
                - water_heater
          multiple: false

    media_player:
      name: Голосовой ассистент
      description: |
        Яндекс Станция или другой media_player для голосового уведомления.
        Если ничего не выбрано — уведомление отправляется на первый доступный media_player.
      default: []
      selector:
        entity:
          filter:
            - domain:
                - media_player
          multiple: true

    boil_phrase:
      name: Команда на кипячение
      default: "Вскипяти воду"
      selector:
        text:

    off_phrase:
      name: Команда на выключение
      default: "Выключи чайник"
      selector:
        text:

    tea_section:
      name: Настройки чайника для чая
      icon: mdi:tea
      collapsed: true
      input:
        tea_boil_phrase:
          name: Команда на кипячение и подогрев для чая
          default: "Вскипяти воду для чая"
          selector:
            text:
        
        tea_heat_phrase:
          name: Команда на подогрев для чая
          default: "Подогрей воду для чая"
          selector:
            text:
        
        tea_target_temperature:
          name: Температура воды для чая
          default: 70
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "°C"
              mode: slider

    coffee_section:
      name: Настройки чайника для кофе
      icon: mdi:coffee
      collapsed: true
      input:
        coffee_boil_phrase:
          name: Команда на кипячение и подогрев для кофе
          default: "Вскипяти воду для кофе"
          selector:
            text:
        
        coffee_heat_phrase:
          name: Команда на подогрев для кофе
          default: "Подогрей воду для кофе"
          selector:
            text:
        
        coffee_target_temperature:
          name: Температура воды для кофе
          default: 85
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "°C"
              mode: slider

    extra_section:
      name: Дополнительные настройки
      icon: tune-vertical
      collapsed: true
      input:
        set_phrase_volume_max:
          name: Громкость фразы
          default: 40
          selector: 
            number:
              min: 10
              max: 100
              step: 10
              mode: slider

        voice_notification_delay:
          name: Задержка уведомления
          description: |
            Задержка в секундах после достижения целевой температуры
            перед голосовым уведомлением.
          default: 5
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: "сек"
              mode: slider

        status_phrase:
          name: Команда на проверку состояния чайника
          description: |
            Команда на проверку досупности, режима, температуры воды и т.д.
          default: "Состояние чайника"
          selector:
            text:

        logging_enabled:
          name: Включить логирование
          description: |
            Включает детальное логирование работы автоматизации.
          default: true
          selector:
            boolean: {}

        debug_mode:
          name: Режим отладки
          description: |
            Включает подробную отладку с каждым изменением состояния.
          default: false
          selector:
            boolean: {}

mode: queued
max: 20
max_exceeded: silent

trigger_variables:
  water_heater: !input water_heater
  media_player: !input media_player

  boil_phrase: !input boil_phrase
  off_phrase: !input off_phrase
  tea_boil_phrase: !input tea_boil_phrase
  coffee_boil_phrase: !input coffee_boil_phrase
  tea_heat_phrase: !input tea_heat_phrase
  coffee_heat_phrase: !input coffee_heat_phrase
  status_phrase: !input status_phrase

# Variables
variables:
  water_heater: !input water_heater
  media_player: !input media_player
  set_phrase_volume_max: !input set_phrase_volume_max

  invalid_states:
    - ''
    - 'unavailable'
    - 'unknown'
    - 'none'

  tea_target_temperature: !input tea_target_temperature
  coffee_target_temperature: !input coffee_target_temperature

triggers:
  - trigger: event
    event_type: yandex_intent
    id: yandex_intent_trigger


actions:
  - choose:
      - conditions: # Голосовая команда: Выключить
          - condition: trigger
            id:
              - yandex_intent_trigger
          # Проверяем, входит ли услышанный текст в список разрешенных фраз открытия (регистронезависимо)
          - condition: template
            value_template: |
              {% set phrases = (off_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          # Фильтрация по разрешенным колонкам
          - condition: template
            value_template: |
              {{ media_player | length == 0 or trigger.event.data.entity_id in media_player }}
        sequence:
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ states(water_heater) in invalid_states }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Не могу выполнить. Чайник недоступен"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ not states(water_heater) in invalid_states }}
                sequence:
                  - action: water_heater.set_operation_mode
                    target:
                      entity_id: !input water_heater
                    data:
                      operation_mode: |
                        {{ 'off' }}
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Чайник выключен"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"



      - conditions: # Голосовая команда: Вскипятить
          - condition: trigger
            id:
              - yandex_intent_trigger
          # Проверяем, входит ли услышанный текст в список разрешенных фраз открытия (регистронезависимо)
          - condition: template
            value_template: |
              {% set phrases = (boil_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          # Фильтрация по разрешенным колонкам
          - condition: template
            value_template: |
              {{ media_player | length == 0 or trigger.event.data.entity_id in media_player }}

        sequence:
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ states(water_heater) in invalid_states }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Не могу вскипятить воду. Чайник недоступен"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ not states(water_heater) in invalid_states }}
                sequence:
                  - action: water_heater.set_operation_mode
                    target:
                      entity_id: !input water_heater
                    data:
                      operation_mode: |
                        {{ 'boil' }}
                  - wait_for_trigger:
                      - trigger: template
                        value_template: "{{ state_attr(water_heater,'current_temperature') == state_attr(water_heater,'temperature') or states(water_heater) == 'off' }}"
                        for:
                          hours: 0
                          minutes: 0
                          seconds: 10
                          milliseconds: 0
                    timeout:
                      hours: 0
                      minutes: 10
                      seconds: 0
                      milliseconds: 0
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Чайник вскипел"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
                      
      - conditions: # Голосовая команда: Вскипятить для чая
          - condition: trigger
            id:
              - yandex_intent_trigger
          - condition: template
            value_template: |
              {% set phrases = (tea_boil_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          - condition: template
            value_template: |
              {{ media_player | length == 0 or trigger.event.data.entity_id in media_player }}

        sequence:
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ states(water_heater) in invalid_states }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Не могу вскипятить воду для чая. Чайник недоступен"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ not states(water_heater) in invalid_states }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: >
                        {{ "Включаю чайник, Сначала кипячу воду, затем остужаю до " ~ tea_target_temperature ~ "°" }}
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
                  - action: water_heater.set_temperature
                    target:
                      entity_id: !input water_heater
                    data:
                      temperature: "{{ tea_target_temperature | int }}"
                  - action: water_heater.set_operation_mode
                    target:
                      entity_id: !input water_heater
                    data:
                      operation_mode: |
                        {{ 'boil_heat' if (state_attr(water_heater,'current_temperature') | int < tea_target_temperature | int) else 'heat' }}
                  - wait_for_trigger:
                      - trigger: template
                        value_template: "{{ state_attr(water_heater,'current_temperature') == state_attr(water_heater,'temperature') or states(water_heater) == 'off' }}"
                        for:
                          hours: 0
                          minutes: 0
                          seconds: 10
                          milliseconds: 0
                    timeout:
                      hours: 0
                      minutes: 10
                      seconds: 0
                      milliseconds: 0
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Чайник подогрет"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"

      - conditions: # Голосовая команда: Подгреть для чая
          - condition: trigger
            id:
              - yandex_intent_trigger
          - condition: template
            value_template: |
              {% set phrases = (tea_heat_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          - condition: template
            value_template: |
              {{ media_player | length == 0 or trigger.event.data.entity_id in media_player }}

        sequence:
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ states(water_heater) in invalid_states }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Не могу Подгреть воду. Чайник недоступен"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ not states(water_heater) in invalid_states }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: >
                        {{ "Включаю чайник, температура воды установлена на " ~ tea_target_temperature ~ "°" }}
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
                  - action: water_heater.set_temperature
                    target:
                      entity_id: !input water_heater
                    data:
                      temperature: "{{ tea_target_temperature | int }}"
                  - action: water_heater.set_operation_mode
                    target:
                      entity_id: !input water_heater
                    data:
                      operation_mode: |
                        {{ 'heat' }}
                  - wait_for_trigger:
                      - trigger: template
                        value_template: "{{ state_attr(water_heater,'current_temperature') == state_attr(water_heater,'temperature') or states(water_heater) == 'off' }}"
                        for:
                          hours: 0
                          minutes: 0
                          seconds: 10
                          milliseconds: 0
                    timeout:
                      hours: 0
                      minutes: 10
                      seconds: 0
                      milliseconds: 0
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Чайник подогрет"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"

      - conditions: # Голосовая команда: Вскипятить для кофе
          - condition: trigger
            id:
              - yandex_intent_trigger
          - condition: template
            value_template: |
              {% set phrases = (coffee_boil_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          - condition: template
            value_template: |
              {{ media_player | length == 0 or trigger.event.data.entity_id in media_player }}

        sequence:
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ states(water_heater) in invalid_states }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Не могу вскипятить воду для кофе. Чайник недоступен"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ not states(water_heater) in invalid_states }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: >
                        {{ "Включаю чайник. Сначала кипячу воду, затем остужаю до " ~ coffee_target_temperature ~ "°" }}
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
                  - action: water_heater.set_temperature
                    target:
                      entity_id: !input water_heater
                    data:
                      temperature: "{{ coffee_target_temperature | int }}"
                  - action: water_heater.set_operation_mode
                    target:
                      entity_id: !input water_heater
                    data:
                      operation_mode: |
                        {{ 'boil_heat' if (state_attr(water_heater,'current_temperature') | int < coffee_target_temperature | int) else 'heat' }}
                  - wait_for_trigger:
                      - trigger: template
                        value_template: "{{ state_attr(water_heater,'current_temperature') == state_attr(water_heater,'temperature') or states(water_heater) == 'off' }}"
                        for:
                          hours: 0
                          minutes: 0
                          seconds: 10
                          milliseconds: 0
                    timeout:
                      hours: 0
                      minutes: 10
                      seconds: 0
                      milliseconds: 0
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Чайник подогрет"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"

      - conditions: # Голосовая команда: Подгреть для чая
          - condition: trigger
            id:
              - yandex_intent_trigger
          - condition: template
            value_template: |
              {% set phrases = (coffee_heat_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          - condition: template
            value_template: |
              {{ media_player | length == 0 or trigger.event.data.entity_id in media_player }}

        sequence:
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ states(water_heater) in invalid_states }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Не могу подогреть воду. Чайник недоступен"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
          - choose:
              - conditions: 
                  - condition: template
                    value_template: |
                      {{ not states(water_heater) in invalid_states }}
                sequence:
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: >
                        {{ "Включаю чайник, температура воды установлена на " ~ coffee_target_temperature ~ "°" }}
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"
                  - action: water_heater.set_temperature
                    target:
                      entity_id: !input water_heater
                    data:
                      temperature: "{{ coffee_target_temperature | int }}"
                  - action: water_heater.set_operation_mode
                    target:
                      entity_id: !input water_heater
                    data:
                      operation_mode: |
                        {{ 'heat' }}
                  - wait_for_trigger:
                      - trigger: template
                        value_template: "{{ state_attr(water_heater,'current_temperature') == state_attr(water_heater,'temperature') or states(water_heater) == 'off' }}"
                        for:
                          hours: 0
                          minutes: 0
                          seconds: 10
                          milliseconds: 0
                    timeout:
                      hours: 0
                      minutes: 10
                      seconds: 0
                      milliseconds: 0
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ trigger.event.data.entity_id }}"
                    data:
                      media_content_id: "Чайник подогрет"
                      media_content_type: text
                      extra:
                        volume_level: "{{ set_phrase_volume_max / 100 }}"

      - conditions: # Голосовая команда: Состояние
          - condition: trigger
            id:
              - yandex_intent_trigger
          - condition: template
            value_template: |
              {% set phrases = (status_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          - condition: template
            value_template: |
              {{ media_player | length == 0 or trigger.event.data.entity_id in media_player }}

        sequence:
          - action: media_player.play_media
            target:
              entity_id: "{{ trigger.event.data.entity_id }}"
            data:
              media_content_id: >
                {% set state = states(water_heater) %}
                {% set current_temp = state_attr(water_heater, 'current_temperature') %}
                {% set target_temp = state_attr(water_heater, 'temperature') %}
                {% set is_heating = (state in ['boil', 'heat', 'boil_heat']) %}

                {% if state in invalid_states %}
                  Чайник сейчас недоступен. Проверьте подключение.
                {% elif current_temp is none or current_temp == 0 %}
                  Не удаётся считать текущую температуру. Возможно, чайник ещё не передал данные.
                {% elif is_heating %}
                  Чайник греет воду. Текущая температура {{ current_temp }}°. Целевая — {{ target_temp | default('не задана') }}°.
                {% else %}
                  Чайник выключен. Текущая температура — {{ current_temp }}°.
                {% endif %}
              media_content_type: text
              extra:
                volume_level: "{{ set_phrase_volume_max / 100 }}"

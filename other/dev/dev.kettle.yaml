blueprint:
  name: Голосовой контроль чайника (Water Heater Voice Control)
  description: |
    Версия 2
    Управление чайником (water_heater) через голосового ассистента.
    Поддерживает голосовые команды, настроенные через интеграцию Yandex.Intents
    и автоматически уведомляет голосом при достижении целевой температуры.
    
    **Требования:**
    - Интеграция water_heater для чайника
    - Интеграция media_player для голосового уведомления
    - Голосовой триггер (yandex_intent)
    
    **Команды (например):**
    - "Вскипяти" → нагрев до 100°C
    - "Вскипяти для чая" → нагрев до 70°C
    - "Подогрей для кофе" → нагрев до 85°C
  domain: automation
  source_url: https://github.com/S0ft0r/ha-blueprints/blob/main/other/dev/dev.kettle.yaml
  author: Softor

  input:
    water_heater:
      name: Чайник (Water Heater)
      description: |
        Сущность water_heater, управляющая чайником.
        Если ничего не выбрано — используется первый доступный water_heater.
      default: ""
      selector:
        entity:
          filter:
            - domain:
                - water_heater
          multiple: false

    media_player:
      name: Голосовой ассистент
      description: |
        Яндекс Станция или другой media_player для голосового уведомления.
        Если ничего не выбрано — уведомление отправляется на первый доступный media_player.
      default: []
      selector:
        entity:
          filter:
            - domain:
                - media_player
          multiple: true

    boil_phrase:
      name: Команда на кипячение
      default: "Вскипяти воду"
      selector:
        text:

    off_phrase:
      name: Команда на выключение
      default: "Выключи чайник"
      selector:
        text:

    tea_section:
      name: Настройки чайника для чая
      icon: mdi:tea
      collapsed: true
      input:
        tea_boil_phrase:
          name: Команда на кипячение и подогрев для чая
          default: "Вскипяти воду для чая"
          selector:
            text:
        
        tea_heat_phrase:
          name: Команда на подогрев для чая
          default: "Подогрей воду для чая"
          selector:
            text:
        
        tea_target_temperature:
          name: Температура воды для чая
          default: 70
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "°C"
              mode: slider

    coffee_section:
      name: Настройки чайника для кофе
      icon: mdi:coffee
      collapsed: true
      input:
        coffee_boil_phrase:
          name: Команда на кипячение и подогрев для кофе
          default: "Вскипяти воду для кофе"
          selector:
            text:
        
        coffee_heat_phrase:
          name: Команда на подогрев для кофе
          default: "Подогрей воду для кофе"
          selector:
            text:
        
        coffee_target_temperature:
          name: Температура воды для кофе
          default: 85
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "°C"
              mode: slider

    extra_section:
      name: Дополнительные настройки
      icon: mdi:tune-vertical
      collapsed: true
      input:
        set_phrase_volume_max:
          name: Громкость фразы
          default: 40
          selector: 
            number:
              min: 10
              max: 100
              step: 10
              mode: slider

        voice_notification_delay:
          name: Задержка уведомления
          description: |
            Задержка в секундах после достижения целевой температуры
            перед голосовым уведомлением.
          default: 10
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: "сек"
              mode: slider

        status_phrase:
          name: Команда на проверку состояния чайника
          description: |
            Команда на проверку доступности, режима, температуры воды и т.д.
          default: "Состояние чайника"
          selector:
            text:

        set_timeout:
          name: Ожидание завершения цикла кипячения/нагрева
          description: |
            Задержка в минутах для завершения цикла работы чайника.
          default: 5
          selector:
            number:
              min: 1
              max: 15
              step: 1
              unit_of_measurement: "мин"
              mode: slider

        # logging_enabled:
        #   name: Включить логирование
        #   description: |
        #     Включает детальное логирование работы автоматизации.
        #   default: true
        #   selector:
        #     boolean: {}

        # debug_mode:
        #   name: Режим отладки
        #   description: |
        #     Включает подробную отладку с каждым изменением состояния.
        #   default: false
        #   selector:
        #     boolean: {}

mode: queued
max: 20
max_exceeded: silent

variables:
  water_heater: !input water_heater
  media_player: !input media_player
  set_phrase_volume_max: !input set_phrase_volume_max
#  voice_notification_delay: !input voice_notification_delay
  tea_target_temperature: !input tea_target_temperature
  coffee_target_temperature: !input coffee_target_temperature
#  set_timeout: !input set_timeout

  invalid_states:
    - ""
    - "unavailable"
    - "unknown"

  off_phrase: !input off_phrase
  boil_phrase: !input boil_phrase
  tea_boil_phrase: !input tea_boil_phrase
  tea_heat_phrase: !input tea_heat_phrase
  coffee_boil_phrase: !input coffee_boil_phrase
  coffee_heat_phrase: !input coffee_heat_phrase
  status_phrase: !input status_phrase

  # ── Распознавание команды ──
  command_match: >
    {% set text = trigger.event.data.text | string | trim | lower %}
    {% set cmds = {
      'off':         off_phrase,
      'boil':        boil_phrase,
      'tea_boil':    tea_boil_phrase,
      'tea_heat':    tea_heat_phrase,
      'coffee_boil': coffee_boil_phrase,
      'coffee_heat': coffee_heat_phrase,
      'status':      status_phrase
    } %}
    {% set ns = namespace(cmd='none') %}
    {% for key, phrases in cmds.items() %}
      {% if text in (phrases | string).split(';') | map('trim') | map('lower') %}
        {% set ns.cmd = key %}
      {% endif %}
    {% endfor %}
    {{ ns.cmd }}

  # ── Параметры, зависящие от команды ──
  target_temp: >
    {{ {'tea_boil': tea_target_temperature, 'tea_heat': tea_target_temperature,
        'coffee_boil': coffee_target_temperature, 'coffee_heat': coffee_target_temperature,
        'boil': 100}.get(command_match, 0) | int }}

  op_mode: >
    {% if command_match == 'off' %}off
    {% elif command_match == 'boil' %}boil
    {% elif command_match in ['tea_boil', 'coffee_boil'] %}
      {{ 'boil_heat' if state_attr(water_heater,'current_temperature')|int(0) < target_temp else 'heat' }}
    {% elif command_match in ['tea_heat', 'coffee_heat'] %}heat
    {% else %}none{% endif %}

  error_msg: >
    {{ {
      'off':         'Не могу выполнить. Чайник недоступен',
      'boil':        'Не могу вскипятить воду. Чайник недоступен',
      'tea_boil':    'Не могу вскипятить воду для чая. Чайник недоступен',
      'tea_heat':    'Не могу подогреть воду для чая. Чайник недоступен',
      'coffee_boil': 'Не могу вскипятить воду для кофе. Чайник недоступен',
      'coffee_heat': 'Не могу подогреть воду для кофе. Чайник недоступен'
    }.get(command_match, 'Чайник недоступен') }}

  start_msg: >
    {% if command_match == 'boil' %}Вскипячу воду
    {% elif command_match in ['tea_boil', 'coffee_boil'] %}
      Включаю чайник. Сначала кипячу воду, затем остужаю до {{ target_temp }}°
    {% elif command_match in ['tea_heat', 'coffee_heat'] %}
      Включаю чайник. Температура воды установлена на {{ target_temp }}°
    {% endif %}

  finish_msg: >
    {{ 'Чайник вскипел' if command_match == 'boil' else 'Чайник подогрет' }}

# ─── Триггер ───────────────────────────────────────────────────
triggers:
  - trigger: event
    event_type: yandex_intent

# ─── Действия ──────────────────────────────────────────────────
actions:
  # 1. Фильтр: команда распознана + разрешённая колонка
  - condition: template
    value_template: "{{ command_match != 'none' }}"
  - condition: template
    value_template: "{{ media_player | length == 0 or trigger.event.data.entity_id in media_player }}"

  # 2. Основная логика
  - choose:
      # ── Статус ──
      - conditions: "{{ command_match == 'status' }}"
        sequence:
          - action: media_player.play_media
            target:
              entity_id: "{{ trigger.event.data.entity_id }}"
            data:
              media_content_type: text
              media_content_id: >
                {% set st = states(water_heater) %}
                {% set cur = state_attr(water_heater, 'current_temperature') %}
                {% set tgt = state_attr(water_heater, 'temperature') %}
                {% if st in invalid_states %}
                  Чайник сейчас недоступен. Проверьте подключение.
                {% elif cur is none or cur == 0 %}
                  Не удаётся считать температуру. Возможно, чайник ещё не передал данные.
                {% elif st in ['boil', 'heat', 'boil_heat'] %}
                  Чайник греет воду. Текущая {{ cur }}°, целевая {{ tgt | default('не задана') }}°.
                {% else %}
                  Чайник выключен. Текущая температура {{ cur }}°.
                {% endif %}
              extra: &vol
                volume_level: "{{ set_phrase_volume_max / 100 }}"

      # ── Недоступен ──
      - conditions: "{{ states(water_heater) in invalid_states }}"
        sequence:
          - action: media_player.play_media
            target:
              entity_id: "{{ trigger.event.data.entity_id }}"
            data:
              media_content_type: text
              media_content_id: "{{ error_msg }}"
              extra: *vol

      # ── Выключение ──
      - conditions: "{{ command_match == 'off' }}"
        sequence:
          - action: water_heater.set_operation_mode
            target:
              entity_id: "{{ water_heater }}"
            data:
              operation_mode: "off"
          - action: media_player.play_media
            target:
              entity_id: "{{ trigger.event.data.entity_id }}"
            data:
              media_content_type: text
              media_content_id: "Чайник выключен"
              extra: *vol

    # ── Нагрев (boil / tea / coffee) ──
    default:
      - action: media_player.play_media
        target:
          entity_id: "{{ trigger.event.data.entity_id }}"
        data:
          media_content_type: text
          media_content_id: "{{ start_msg }}"
          extra: *vol

      - choose:
          - conditions: "{{ command_match != 'boil' }}"
            sequence:
              - action: water_heater.set_temperature
                target:
                  entity_id: "{{ water_heater }}"
                data:
                  temperature: "{{ target_temp }}"

      - action: water_heater.set_operation_mode
        target:
          entity_id: "{{ water_heater }}"
        data:
          operation_mode: "{{ op_mode }}"

      - wait_for_trigger:
          - trigger: template
            value_template: >
              {{ state_attr(water_heater,'current_temperature')|float(0)
                 >= state_attr(water_heater,'temperature')|float(0)
                 or states(water_heater) in ['off', 'idle'] }}
            for:
              seconds: !input voice_notification_delay
        timeout:
          minutes: !input set_timeout
        continue_on_timeout: true

      # - delay:
      #     seconds: "{{ voice_notification_delay | int }}"

      - choose:
          - conditions: "{{ wait.completed }}"
            sequence:
              - action: media_player.play_media
                target:
                  entity_id: "{{ trigger.event.data.entity_id }}"
                data:
                  media_content_type: text
                  media_content_id: "{{ finish_msg }}"
                  extra: *vol
        default:
          - action: media_player.play_media
            target:
              entity_id: "{{ trigger.event.data.entity_id }}"
            data:
              media_content_type: text
              media_content_id: "Не удалось дождаться. Проверьте чайник."
              extra: *vol
  #     {% set current_temp = state_attr(water_heater, 'temperature') | float(0) %}
  #     {% set target_temp = target_temperatures.boil | int(100) %}
  #     {% set tolerance = 0.5 %}
  #     {{ current_temp >= target_temp - tolerance and current_temp >= target_temp - tolerance }}
  #   id: target_reached_trigger


actions:
  - choose:
      - conditions: # Голосовая команда: Вскипятить
          - condition: trigger
            id:
              - yandex_intent_trigger
          # Проверяем, входит ли услышанный текст в список разрешенных фраз открытия (регистронезависимо)
          - condition: template
            value_template: |
              {% set phrases = (boil_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          # Фильтрация по разрешенным колонкам
          - condition: template
            value_template: |
              {{ yandex_media_player | length == 0 or trigger.event.data.entity_id in yandex_media_player }}

        sequence:
          - action: water_heater.set_operation_mode
            target:
              entity_id: !input water_heater
            data:
              operation_mode: |
                {{ 'boil' }}

      - conditions: # Голосовая команда: Вскипятить для чая
          - condition: trigger
            id:
              - yandex_intent_trigger
          - condition: template
            value_template: |
              {% set phrases = (tea_boil_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          - condition: template
            value_template: |
              {{ yandex_media_player | length == 0 or trigger.event.data.entity_id in yandex_media_player }}

        sequence:
          - action: water_heater.set_temperature
            target:
              entity_id: !input water_heater
            data:
              temperature: "{{ tea_target_temperature | int }}"
          - action: water_heater.set_operation_mode
            target:
              entity_id: !input water_heater
            data:
              operation_mode: |
                {{ 'boil_heat' if (state_attr(water_heater,'current_temperature') | int < tea_target_temperature | int) else 'heat' }}

      - conditions: # Голосовая команда: Подгреть для чая
          - condition: trigger
            id:
              - yandex_intent_trigger
          - condition: template
            value_template: |
              {% set phrases = (tea_heat_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          - condition: template
            value_template: |
              {{ yandex_media_player | length == 0 or trigger.event.data.entity_id in yandex_media_player }}

        sequence:
          - action: water_heater.set_temperature
            target:
              entity_id: !input water_heater
            data:
              temperature: "{{ tea_target_temperature | int }}"
          - action: water_heater.set_operation_mode
            target:
              entity_id: !input water_heater
            data:
              operation_mode: |
                {{ 'heat' }}

      - conditions: # Голосовая команда: Вскипятить для кофе
          - condition: trigger
            id:
              - yandex_intent_trigger

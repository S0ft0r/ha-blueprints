blueprint:
  name: Голосовой контроль чайника (Water Heater Voice Control)
  description: |
    Управление чайником (water_heater) через голосового ассистента.
    Поддерживает команды: "Вскипяти", "Вскипяти для чая", "Подогрей для кофе"
    и автоматически уведомляет голосом при достижении целевой температуры.
    
    **Требования:**
    - Интеграция water_heater для чайника
    - Интеграция media_player для голосового уведомления
    - Голосовой триггер (yandex_intent, wake_word, или custom event)
    
    **Команды:**
    - "Вскипяти" → нагрев до 100°C
    - "Вскипяти для чая" → нагрев до 70°C
    - "Подогрей для кофе" → нагрев до 85°C
  domain: automation
  source_url: https://github.com/S0ft0r/ha-blueprints/blob/main/other/dev/dev.kettle.yaml
  author: Softor

  input:
    water_heater:
      name: Чайник (Water Heater)
      description: |
        Сущность water_heater, управляющая чайником.
        Если ничего не выбрано — используется первый доступный water_heater.
      default: ""
      selector:
        entity:
          filter:
            - domain:
                - water_heater
          multiple: false

    media_player:
      name: Голосовой ассистент
      description: |
        Яндекс Станция или другой media_player для голосового уведомления.
        Если ничего не выбрано — уведомление отправляется на первый доступный media_player.
      default: []
      selector:
        entity:
          filter:
            - domain:
                - media_player
          multiple: true

    boil_phrase:
      name: Команда на кипячение
      default: "Вскипяти воду"
      selector:
        text:

    tea_section:
        name: Настройки чайника для чая
        icon: mdi:tea
        collapsed: true
        input:
          tea_boil_phrase:
            name: Команда на кипячение и подогрев для чая
            default: "Вскипяти воду для чая"
            selector:
              text:
          tea_heat_phrase:
            name: Команда на кипячение и подогрев для чая
            default: "Подогрей воду для чая"
            selector:
              text:
          tea_target_temperature:
            name: Температура воды для чая
            default: 70
            selector:
              number:
                min: 50
                max: 100
                step: 1
                unit_of_measurement: "°C"
                mode: slider

    coffee_section:
        name: Настройки чайника для кофе
        icon: mdi:coffee
        collapsed: true
        input:
          coffee_boil_phrase:
            name: Команда на кипячение и подогрев для кофе
            default: "Вскипяти воду для кофе"
            selector:
              text:
          coffee_heat_phrase:
            name: Команда на подогрев для кофе
            default: "Подогрей воду для кофе"
            selector:
              text:
          coffee_target_temperature:
            name: Температура воды для чая
            default: 85
            selector:
              number:
                min: 50
                max: 100
                step: 1
                unit_of_measurement: "°C"
                mode: slider

    extra_section:
        name: Дополнительные настройки
        icon: tune-vertical
        collapsed: true
        input:
          voice_notification_delay:
            name: Задержка уведомления
            description: |
              Задержка в секундах после достижения целевой температуры
              перед голосовым уведомлением.
            default: 5
            selector:
              number:
                min: 0
                max: 60
                step: 1
                unit_of_measurement: "сек"
                mode: box

          voice_command_status:
            name: Команда на проверку состояния чайника
            description: |
              Команда на проверку досупности, режима, температуры воды и т.д.
            default: "Состояние чайника"
            selector:
              text:

          logging_enabled:
            name: Включить логирование
            description: |
              Включает детальное логирование работы автоматизации.
            default: true
            selector:
              boolean: {}

          debug_mode:
            name: Режим отладки
            description: |
              Включает подробную отладку с каждым изменением состояния.
            default: false
            selector:
              boolean: {}

mode: queued
max: 20
max_exceeded: silent

trigger_variables:
  water_heater: !input water_heater
  media_player: !input media_player

  boil_phrase: !input boil_phrase
  tea_boil_phrase: !input tea_boil_phrase
  coffee_boil_phrase: !input coffee_boil_phrase
  tea_heat_phrase: !input tea_heat_phrase
  coffee_heat_phrase: !input coffee_heat_phrase
  tea_target_temperature: !input tea_target_temperature
  coffee_target_temperature: !input coffee_target_temperature

# Variables
variables:
  # Команды и их целевые температуры
  command_map:
    boil: 100
    tea: "{{ target_temperatures.tea | int(70) }}"
    coffee: "{{ target_temperatures.coffee | int(85) }}"
  
  # Вычисляемые значения
  is_target_reached: >-
    {% set current_temp = state_attr(water_heater, 'temperature') | float(0) %}
    {% set target_temp = target_temperatures.boil | int(100) %}
    {{ current_temp >= target_temp }}
  
  target_temperature: >-
    {% set current_temp = state_attr(water_heater, 'temperature') | float(0) %}
    {% set target_temp = target_temperatures.boil | int(100) %}
    {{ [current_temp, target_temp] | max }}

  # История состояний для отслеживания изменений
  last_command: ""
  last_target_temp: "{{ target_temperatures.boil | int(100) }}"
  last_state: "{{ states(water_heater) }}"
  last_temperature: "{{ state_attr(water_heater, 'temperature') | float(0) }}"

  water_heater: !input water_heater
  media_player: !input media_player


triggers:
  - trigger: event
    event_type: yandex_intent
    id: yandex_intent_trigger


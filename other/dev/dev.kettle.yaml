            value_template: |
              {% set phrases = (coffee_boil_phrase | string).split(';') | map('trim') | map('lower') | list %}
              {{ trigger.event.data.text | string | trim | lower in phrases }}
          - condition: template
            value_template: |
              {{ yandex_media_player | length == 0 or trigger.event.data.entity_id in yandex_media_player }}

        sequence:
          - action: water_heater.set_temperature
            target:
              entity_id: !input water_heater
            data:
              temperature: "{{ coffee_target_temperature | int }}"
          - action: water_heater.set_operation_mode
            target:
              entity_id: !input water_heater
            data:
              operation_mode: |
                {{ 'boil_heat' if (state_attr(water_heater,'current_temperature') | int < coffee_target_temperature | int) else 'heat' }}

      - conditions: # Голосовая команда: Подгреть для чая
          - condition: trigger
            id:
              - yandex_intent_trigger
          - condition: template
            value_template: |
              {% set phrases = (coffe_heat_phrase | string).split(';') | map('trim') | map('lower') | list %}

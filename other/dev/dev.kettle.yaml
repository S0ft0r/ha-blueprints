              entity_id: !input water_heater
            data:
              temperature: "{{ cofee_target_temperature | int }}"
          - action: water_heater.set_operation_mode
            target:
              entity_id: !input water_heater
            data:
              operation_mode: |
                {{ 'heat' }}


